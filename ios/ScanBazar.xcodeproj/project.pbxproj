			shellScript = "# This script runs during the Xcode build phase.\n# It dynamically patches/restores MLKit frameworks based on whether we are building for Simulator or Device.\n\nexec > \"${SRCROOT}/build_phase.log\" 2>&1\nPODS_ROOT=\"${SRCROOT}/Pods\"\nPATCH_SCRIPT=\"${SRCROOT}/patch_mlimage/patch_all_mlkit.py\"\n\necho \"Running MLKit patch manager...\"\necho \"Platform: $EFFECTIVE_PLATFORM_NAME\"\necho \"SDK: $SDK_NAME\"\n\nif [ \"$EFFECTIVE_PLATFORM_NAME\" = \"-iphonesimulator\" ]; then\n  # Building for iOS Simulator: apply patch if not already applied\n  if [ -f \"$PATCH_SCRIPT\" ]; then\n    echo \"Ensuring MLKit framework binaries are patched for Simulator...\"\n    python3 \"$PATCH_SCRIPT\" \"$PODS_ROOT\"\n  else\n    echo \"Error: patch_all_mlkit.py not found at $PATCH_SCRIPT\"\n  fi\nelse\n  # Building for iOS Device: restore original unpatched binaries from backups\n  echo \"Restoring original MLKit framework binaries from backup for Device build...\"\n  find \"$PODS_ROOT\" -name \"*.bak\" | while read -r bak_path; do\n    binary_path=\"${bak_path%.bak}\"\n    if [ -f \"$bak_path\" ]; then\n      echo \"  Restoring $binary_path from backup\"\n      cp -f \"$bak_path\" \"$binary_path\"\n    fi\n  done\nfi\n";
